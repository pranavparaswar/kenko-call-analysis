<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenko · Weekly Call Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1c2434; --muted:#6b7280; --line:#e7e9ee;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --brand:#0e7c66; --brandsoft:#e6f4f0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--brand)}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .seg{display:inline-flex;background:#eef1f4;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font:inherit;
    font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg.subseg{margin-top:10px}
  .seg.subseg button{padding:5px 13px;font-size:12px}
  .hidden{display:none}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr);margin:22px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .kpi .n{font-size:28px;font-weight:650;letter-spacing:-.02em}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .kpi .d{font-size:12px;margin-top:8px}
  .cols{grid-template-columns:1.3fr 1fr;margin-bottom:16px}
  .card h3{margin:0 0 14px;font-size:14px;font-weight:600}
  .card h3 .tag{font-weight:500;color:var(--muted);font-size:12px}
  .chartbox{position:relative;height:230px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
  tbody tr:hover{background:#fafbfc;cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .pos{background:#dcfce7;color:#166534}.neu{background:#f1f5f9;color:#475569}.neg{background:#fee2e2;color:#991b1b}
  .rl{background:#e6f4f0;color:#0e7c66}.rln{background:#eef2ff;color:#4338ca}
  .score{font-weight:650}
  .chk{display:inline-flex;gap:3px}
  .dot{width:13px;height:13px;border-radius:3px;background:#eef1f4}
  .dot.on{background:var(--green)}.dot.off{background:#f0c9c9}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
  select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .muted{color:var(--muted)}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}
  .ov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:24px}
  .modal h2{margin:0 0 2px;font-size:18px}
  .modal .x{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .kv{margin:14px 0}
  .kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
  .checkrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .ai li{margin:3px 0}
  footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>Kenko</span> · Weekly Call Analysis</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="seg" id="roleSeg">
      <button data-r="all" class="on">All</button>
      <button data-r="sales">Sales</button>
      <button data-r="nutrition">Nutrition</button>
    </div>
  </header>

  <div class="seg subseg hidden" id="typeSeg"></div>

  <div class="controls" id="repFilterRow" style="margin-top:14px">
    <label class="muted" style="font-size:12px;font-weight:600">Filter by rep</label>
    <select id="fRep"></select>
  </div>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid cols">
    <div class="card">
      <h3>Must-cover compliance by rep <span class="tag" id="repTag"></span></h3>
      <div class="chartbox"><canvas id="repChart"></canvas></div>
      <div class="legend">% of that rep's required must-cover items completed across their calls. Bar color: green ≥80, amber ≥60, red below.</div>
    </div>
    <div class="card">
      <h3>Customer sentiment</h3>
      <div class="chartbox"><canvas id="sentChart"></canvas></div>
    </div>
  </div>

  <div class="grid cols" id="checkWrap"></div>

  <div class="card" style="margin-top:16px" id="dropCard">
    <h3>Call outcomes <span class="tag">— missed &amp; short calls</span></h3>
    <div class="chartbox" style="height:200px"><canvas id="dropChart"></canvas></div>
    <div class="legend" id="dropLegend"></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>Calls</h3>
    <div class="controls">
      <select id="fStatus">
        <option value="">All calls</option>
        <option value="done">Analyzed only</option>
        <option value="short">Short calls</option>
        <option value="missed">Missed calls</option>
        <option value="error">Needs re-analysis</option>
      </select>
      <select id="fSent">
        <option value="">All sentiment</option><option>Positive</option><option>Neutral</option><option>Negative</option>
      </select>
      <input id="fSearch" placeholder="Search client / mobile number / summary…" style="flex:1;min-width:160px">
      <span class="muted" id="count"></span>
    </div>
    <table>
      <thead><tr>
        <th data-s="date">Date</th><th data-s="role">Role</th><th data-s="rep">Rep</th>
        <th data-s="client">Client</th><th data-s="duration_sec">Dur</th>
        <th data-s="sentiment">Sentiment</th><th data-s="qa_score">QA</th>
        <th>Must-cover</th><th>Summary</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer id="foot"></footer>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
const DATA = /*__DATA__*/{};
const TAX = DATA.taxonomy || {};                   // role -> call_type -> {desc, checkpoints}
const CALLS = DATA.calls || [];
let ROLE = "all", CTYPE = "all", REP = "", sortKey="date", sortDir=-1;
let charts = {};

const fmtDur = s => (s>=60? Math.floor(s/60)+"m "+(s%60)+"s" : s+"s");
const sclass = s => s==="Positive"?"pos":s==="Negative"?"neg":"neu";
const scoreColor = v => v>=80?"var(--green)":v>=60?"var(--amber)":"var(--red)";
const prettyType = t => (t||"").replace(/_/g," ").replace(/\b\w/g,m=>m.toUpperCase());
const clFor = c => (((TAX[c.role]||{})[c.call_type]||{}).checkpoints) || [];
const wOf = x => (x.weight==null?1:x.weight);   // checkpoint weight (default 1)
// weighted compliance: share of total checkpoint weight the rep actually earned
const complianceOf = c => { const cl=clFor(c), m=c.must_say||{}; if(!cl.length) return 0;
  const tot=cl.reduce((s,x)=>s+wOf(x),0);
  const got=cl.reduce((s,x)=>s+(m[x.id]?wOf(x):0),0);
  return tot? Math.round(100*got/tot):0; };
// a call whose analysis failed to parse has qa_score:null — a system/model
// failure, not the rep's fault, so it must never count as a 0 in any average
const isScored = c => c.qa_score != null;
// "error" = the model's response genuinely failed to parse (needs re-run).
// "missed"/"short" are NOT errors — they're calls too brief for the checklist
// (no recording, or under MIN_DURATION_SEC) and get a drop_reason instead.
const isFailed = c => c.status === "error";
const isDropped = c => c.status === "missed" || c.status === "short";
const scopeByType = () => CALLS.filter(c =>
  (ROLE==="all" || c.role===ROLE) &&
  (ROLE!=="nutrition" || CTYPE==="all" || c.call_type===CTYPE));
const filtered = () => { const s = scopeByType(); return REP ? s.filter(c=>c.rep===REP) : s; };
// follow_up is its own tracked category but excluded from "overall" scoring rollups
// (KPIs / rep chart / sentiment) — it still appears in the calls table with its own score.
const forOverall = a => a.filter(c => !(c.role==="sales" && c.call_type==="follow_up"));
const avg = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
const roleName = r => r==="nutrition"?"Nutrition":"Sales";

// ---- role segmented control
document.querySelectorAll("#roleSeg button").forEach(b=>b.onclick=()=>{
  ROLE=b.dataset.r;
  document.querySelectorAll("#roleSeg button").forEach(x=>x.classList.toggle("on",x===b));
  if(ROLE!=="nutrition") CTYPE="all";        // don't let a stale type filter persist
  document.getElementById("typeSeg").classList.toggle("hidden", ROLE!=="nutrition");
  buildTypeSeg();
  buildRepFilter(); renderAll();
});

// ---- nutrition call-type sub-tabs (derived from the taxonomy)
function buildTypeSeg(){
  const wrap = document.getElementById("typeSeg");
  const types = Object.keys(TAX.nutrition || {});
  wrap.innerHTML = ["all"].concat(types).map(t=>
    `<button data-t="${t}" class="${CTYPE===t?"on":""}">${t==="all"?"All types":prettyType(t)}</button>`).join("");
  wrap.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    CTYPE=b.dataset.t;
    wrap.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    buildRepFilter();
    renderAll();
  });
}

document.getElementById("sub").textContent =
  `Last ${DATA.period_days||7} days · ${CALLS.length} calls `+
  `(${CALLS.filter(c=>c.role==="sales").length} sales · ${CALLS.filter(c=>c.role==="nutrition").length} nutrition) · `+
  `generated ${(DATA.generated_at||"").replace("T"," ")}`;

function destroyCharts(){ Object.values(charts).forEach(c=>c&&c.destroy()); charts={}; }

function renderAll(){
  const set = filtered();
  const overall = forOverall(set);   // excludes follow_up from the rollups below
  renderKpis(overall);
  renderRepChart(overall);
  renderSentChart(overall);
  renderCheckWrap();
  renderDropChart(set);   // missed/short calls — not follow_up-excluded, it's volume not scoring
  render();      // table — still shows follow_up rows with their own score
}

// ---- missed/short call outcomes (why calls are dropping)
function renderDropChart(set){
  const drop = set.filter(isDropped);
  const counts = {};
  drop.forEach(c=>{ const k=c.drop_reason||"other"; counts[k]=(counts[k]||0)+1; });
  const labels = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const data = labels.map(k=>counts[k]);
  charts.drop && charts.drop.destroy();
  charts.drop = new Chart(document.getElementById("dropChart"), {type:"bar",
    data:{labels:labels.map(prettyType), datasets:[{data,borderRadius:6,backgroundColor:"#0e7c66"}]},
    options:{indexAxis:"y",plugins:{legend:{display:false}},
      scales:{x:{ticks:{precision:0,stepSize:1}}}}});
  const missedN = set.filter(c=>c.status==="missed").length;
  const shortN = set.filter(c=>c.status==="short").length;
  document.getElementById("dropLegend").textContent = drop.length
    ? `${drop.length} of ${set.length} calls in view were missed or too short for the checklist `+
      `(${missedN} missed/no-answer, ${shortN} short but connected). Reasons come from the `+
      `transcript when there is one.`
    : "No missed or short calls in the current view.";
}

// ---- KPIs
function renderKpis(set){
  const scored = set.filter(isScored);
  const failed = set.filter(isFailed).length;
  const dropped = set.filter(isDropped).length;
  const qaAvg = Math.round(avg(scored.map(c=>c.qa_score)));
  const posPct = Math.round(100*scored.filter(c=>c.sentiment==="Positive").length/(scored.length||1));
  const compAvg = Math.round(avg(scored.map(complianceOf)));
  const neg = scored.filter(c=>c.sentiment==="Negative").length;
  const kpis=[
   {n:set.length,l:"Calls captured",d: (ROLE==="all"?"across both teams":roleName(ROLE)+" team") +
     (dropped? ` · ${dropped} missed/short (not checklist-scored)` : "") +
     (failed? ` · <span style="color:var(--amber)">${failed} need re-analysis</span>` : "")},
   {n:qaAvg,l:"Avg QA score",d:`<span style="color:${scoreColor(qaAvg)}">${qaAvg>=80?"On track":qaAvg>=60?"Needs attention":"At risk"}</span>`},
   {n:posPct+"%",l:"Positive sentiment",d:`${neg} negative flagged`},
   {n:compAvg+"%",l:"Must-cover compliance",d:"each call vs its call-type checklist"},
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k=>
    `<div class="card kpi"><div class="n">${k.n}</div><div class="l">${k.l}</div><div class="d">${k.d}</div></div>`).join("");
}

// ---- per-rep compliance
function renderRepChart(set){
  document.getElementById("repTag").textContent =
    REP ? "("+REP+")" : (ROLE==="all"?"(all reps)":"("+roleName(ROLE)+")");
  const scored = set.filter(isScored);
  const reps=[...new Set(scored.map(c=>c.rep))];
  const data=reps.map(r=>{const cc=scored.filter(c=>c.rep===r);return Math.round(avg(cc.map(complianceOf)));});
  const cnt=reps.map(r=>scored.filter(c=>c.rep===r).length);
  const order=reps.map((r,i)=>i).sort((a,b)=>data[b]-data[a]);
  const L=order.map(i=>reps[i]), D=order.map(i=>data[i]), C=order.map(i=>cnt[i]);
  charts.rep && charts.rep.destroy();
  charts.rep=new Chart(document.getElementById("repChart"),{type:"bar",
   data:{labels:L,datasets:[{data:D,borderRadius:6,
     backgroundColor:D.map(v=>v>=80?"#16a34a":v>=60?"#d97706":"#dc2626")}]},
   options:{indexAxis:"y",plugins:{legend:{display:false},
     tooltip:{callbacks:{afterLabel:ctx=>C[ctx.dataIndex]+" calls"}}},
     scales:{x:{max:100,ticks:{callback:v=>v+"%"}}}}});
}

// ---- sentiment donut
function renderSentChart(set){
  const scored = set.filter(isScored);
  const sc={Positive:0,Neutral:0,Negative:0}; scored.forEach(c=>sc[c.sentiment]=(sc[c.sentiment]||0)+1);
  charts.sent && charts.sent.destroy();
  charts.sent=new Chart(document.getElementById("sentChart"),{type:"doughnut",
   data:{labels:Object.keys(sc),datasets:[{data:Object.values(sc),
     backgroundColor:["#16a34a","#94a3b8","#dc2626"]}]},
   options:{cutout:"62%",plugins:{legend:{position:"bottom"}}}});
}

// ---- compliance by call type (for the role(s) in scope)
function renderCheckWrap(){
  const wrap=document.getElementById("checkWrap");
  ["cov_sales","cov_nutrition"].forEach(k=>{charts[k]&&charts[k].destroy();});
  const rolesToShow = ROLE==="all"? Object.keys(TAX) : [ROLE];
  wrap.style.gridTemplateColumns = rolesToShow.length>1? "1fr 1fr":"1fr";
  wrap.innerHTML = rolesToShow.map(r=>
    `<div class="card"><h3>Compliance by call type <span class="tag">— ${roleName(r)}</span></h3>
       <div class="chartbox" style="height:220px"><canvas id="cov_${r}"></canvas></div>
       <div class="legend">Avg % of that call type's checkpoints covered · (n) = calls of that type.</div></div>`).join("");
  rolesToShow.forEach(r=>{
    const types=Object.keys(TAX[r]||{});
    const labels=[], data=[], counts=[];
    types.forEach(t=>{
      const set=CALLS.filter(c=>c.role===r && c.call_type===t && (!REP||c.rep===REP));
      labels.push(prettyType(t));
      counts.push(set.length);
      data.push(set.length? Math.round(avg(set.map(complianceOf))):0);
    });
    charts["cov_"+r]=new Chart(document.getElementById("cov_"+r),{type:"bar",
     data:{labels,datasets:[{data,borderRadius:6,
       backgroundColor:data.map(v=>v>=80?"#16a34a":v>=60?"#d97706":"#dc2626")}]},
     options:{indexAxis:"y",plugins:{legend:{display:false},
       tooltip:{callbacks:{afterLabel:ctx=>counts[ctx.dataIndex]+" calls"}}},
       scales:{x:{max:100,ticks:{callback:v=>v+"%"}}}}});
  });
}

// ---- top-level rep filter (drives filtered(), so every metric respects it)
function buildRepFilter(){
  const scope=scopeByType();
  const reps=[...new Set(scope.map(c=>c.rep))].sort();
  if(REP && !reps.includes(REP)) REP="";      // stale rep no longer in the current team/type scope
  const roleOf=r=>{ const c=scope.find(x=>x.rep===r); return c?c.role:""; };
  const fRep=document.getElementById("fRep");
  fRep.innerHTML = '<option value="">All reps</option>' +
    reps.map(r=>`<option value="${r}">${r}${ROLE==="all"?" ("+roleName(roleOf(r))+")":""}</option>`).join("");
  fRep.value = REP;
}
document.getElementById("fRep").addEventListener("input", ()=>{
  REP = document.getElementById("fRep").value;
  renderAll();
});
["fStatus","fSent","fSearch"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{
  const k=th.dataset.s; sortDir = sortKey===k? -sortDir : 1; sortKey=k; render();});

function render(){
  const st=document.getElementById("fStatus").value,
        s=document.getElementById("fSent").value,
        qRaw=document.getElementById("fSearch").value,
        q=qRaw.toLowerCase(),
        qDigits=qRaw.replace(/\D/g,"");
  // phone search is digit-normalized (ignores spaces/dashes/+/country code punctuation)
  // so "9632081711" matches a stored number like "91-9632081711"
  let list=filtered().filter(c=>(!st||c.status===st)&&(!s||c.sentiment===s)&&
    (!q||(c.client+" "+c.summary).toLowerCase().includes(q)||
      (qDigits.length>=4 && (c.client_number||"").replace(/\D/g,"").includes(qDigits))));
  list.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];
    if(typeof x==="string"){x=x||"";y=y||"";return x<y?-sortDir:x>y?sortDir:0;}
    return ((x||0)-(y||0))*sortDir;});
  document.getElementById("rows").innerHTML=list.map(c=>{
    const idx=CALLS.indexOf(c), cl=clFor(c);
    const failed=c.status==="error", missed=c.status==="missed", short=c.status==="short";
    const dots = failed
      ? `<span class="pill neu" style="font-size:11px">needs re-analysis</span>`
      : (missed||short) ? `<span class="muted" style="font-size:11px">—</span>`
      : cl.map(x=>`<span class="dot ${(c.must_say||{})[x.id]?"on":"off"}" title="${x.label}"></span>`).join("");
    const sentCell = failed ? `<span class="pill neu">—</span>`
      : missed ? `<span class="pill neu">Missed</span>`
      : short ? `<span class="pill neu">Short</span>`
      : `<span class="pill ${sclass(c.sentiment)}">${c.sentiment}</span>`;
    const scoreCell = (failed||missed||short) ? "—" : c.qa_score;
    const typeTag = c.call_type ? `<div class="muted" style="font-size:11px">${prettyType(c.call_type)}</div>`
      : missed ? `<div class="muted" style="font-size:11px">Missed</div>`
      : short ? `<div class="muted" style="font-size:11px">Short call</div>` : "";
    const summaryCell = failed ? "Analysis failed to parse — not the rep's fault, needs re-run"
      : missed ? c.drop_note
      : short ? `<b>${prettyType(c.drop_reason)}</b>${c.drop_note?" — "+c.drop_note:""}${c.callback_time?` (callback: ${c.callback_time})`:""}`
      : c.summary;
    return `<tr onclick="openCall(${idx})" ${failed?'style="opacity:.65"':""}>
      <td>${c.date}</td>
      <td><span class="pill ${c.role==='nutrition'?'rln':'rl'}">${roleName(c.role)}</span>
        ${typeTag}</td>
      <td>${c.rep}</td>
      <td>${c.client}${c.client_number?`<div class="muted" style="font-size:11px">${c.client_number}</div>`:""}</td>
      <td class="muted">${fmtDur(c.duration_sec||0)}</td>
      <td>${sentCell}</td>
      <td class="score" style="color:${(failed||missed||short)?'var(--muted)':scoreColor(c.qa_score)}">${scoreCell}</td>
      <td><span class="chk">${dots}</span></td>
      <td class="muted" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${summaryCell}</td>
    </tr>`;}).join("");
  document.getElementById("count").textContent=list.length+" of "+filtered().length;
}

// ---- modal
window.openCall=function(i){
  const c=CALLS[i], cl=clFor(c), m=c.must_say||{}, mv=c.metric_values||{};
  const failed=c.status==="error", missed=c.status==="missed", short=c.status==="short";
  const wlabel=w=>w>=3?"core":w>=2?"important":"hygiene";

  if (missed || short) {
    document.getElementById("modal").innerHTML=`
      <span class="x" onclick="closeOv()">✕</span>
      <h2>${c.client} · ${c.rep}</h2>
      <div class="muted">${c.client_number? c.client_number+" · " : ""}${c.date} · ${fmtDur(c.duration_sec||0)} · ${c.direction||""}
        · <span class="pill ${c.role==='nutrition'?'rln':'rl'}">${roleName(c.role)}</span>
        · <span class="pill neu">${missed?"Missed / no answer":"Short call"}</span></div>
      <div class="kv"><div class="k">Why</div>
        <span class="pill neu">${prettyType(c.drop_reason)}</span> ${c.drop_note||""}
        ${c.callback_time?`<div class="muted" style="font-size:12px;margin-top:4px">Customer asked for a callback: <b>${c.callback_time}</b></div>`:""}</div>
      <div class="kv"><div class="k">Sentiment</div>
        ${short?`<span class="pill ${sclass(c.sentiment)}">${c.sentiment}</span>`:"<span class='muted'>Not applicable — call never connected.</span>"}</div>
      <div class="kv"><div class="k">QA score</div>
        <span class="muted">Not applicable — ${missed?"no recording to score.":"too short for the checklist."}</span></div>
      ${short?`<div class="kv"><div class="k">Audio file to verify against</div>
        <span class="muted" style="font-size:12px">Play <b>audio/${c.call_id}.mp3</b> and check it matches the transcript below.</span></div>
      <div class="kv"><div class="k">Transcript</div>
        <div style="max-height:220px;overflow:auto;background:#f6f7f9;border:1px solid var(--line);
          border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12px;line-height:1.5">${
          (c.transcript && c.transcript!=="[sample]") ? c.transcript : "<span class='muted'>Transcript not stored for this call.</span>"
        }</div></div>`:""}`;
    document.getElementById("ov").classList.add("on");
    return;
  }

  const rows = failed
    ? `<div class="muted">Not available — the model's response for this call failed to parse.
        This is a system/formatting issue, not a reflection of the rep's performance.
        Re-run <code>pipeline.py --reprocess</code> to score it once fixed.</div>`
    : cl.map(x=>{const w=wOf(x),hit=m[x.id],val=mv[x.id];
        return `<div class="checkrow"><span>${x.label}
          <span class="muted" style="font-size:11px">· ${wlabel(w)} (×${w})</span>
          ${val?`<div class="muted" style="font-size:11px;margin-top:2px">${val}</div>`:""}</span>
        <span class="pill ${hit?'pos':(w>=3?'neg':'neu')}">${hit?'Yes':'Missed'}</span></div>`;}).join("");
  const ai=(c.action_items||[]).length? "<ul class='ai'>"+c.action_items.map(a=>`<li>${a}</li>`).join("")+"</ul>":"<span class='muted'>None</span>";
  document.getElementById("modal").innerHTML=`
    <span class="x" onclick="closeOv()">✕</span>
    <h2>${c.client} · ${c.rep}</h2>
    <div class="muted">${c.client_number? c.client_number+" · " : ""}${c.date} · ${fmtDur(c.duration_sec||0)} · ${c.direction||""}
      · <span class="pill ${c.role==='nutrition'?'rln':'rl'}">${roleName(c.role)}</span>
      ${c.call_type?`· <span class="pill neu">${prettyType(c.call_type)}</span>`:(failed?`· <span class="pill neu">Unclassified</span>`:"")}</div>
    <div class="kv"><div class="k">Summary</div>${failed?"<span class='muted'>Not available.</span>":(c.summary||"—")}</div>
    <div class="kv"><div class="k">Sentiment</div>
      ${failed?"<span class='muted'>Not available.</span>":`<span class="pill ${sclass(c.sentiment)}">${c.sentiment}</span> ${c.sentiment_reason||""}`}</div>
    <div class="kv"><div class="k">QA score <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">(weighted checklist coverage)</span></div>
      ${failed
        ? `<span class="pill neu">Needs re-analysis</span> — analysis failed to parse for this call; excluded from every average, not counted against the rep.`
        : `<span class="score" style="color:${scoreColor(c.qa_score)}">${c.qa_score}/100</span> — ${c.qa_notes||""}
           ${c.qa_score_model!=null?`<div class="muted" style="font-size:11px;margin-top:3px">Model's own rating: ${c.qa_score_model}/100</div>`:""}`}</div>
    <div class="kv"><div class="k">Must-cover checklist (${roleName(c.role)} · ${prettyType(c.call_type)||"—"})</div>${rows}</div>
    <div class="kv"><div class="k">Action items</div>${ai}</div>
    <div class="kv"><div class="k">Audio file to verify against</div>
      <span class="muted" style="font-size:12px">Play <b>audio/${c.call_id}.mp3</b> and check it matches the transcript below.</span></div>
    <div class="kv"><div class="k">Transcript (verify this matches the client above)</div>
      <div style="max-height:220px;overflow:auto;background:#f6f7f9;border:1px solid var(--line);
        border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12px;line-height:1.5">${
        (c.transcript && c.transcript!=="[sample]") ? c.transcript : "<span class='muted'>Transcript not stored for this call.</span>"
      }</div></div>`;
  document.getElementById("ov").classList.add("on");
};
window.closeOv=()=>document.getElementById("ov").classList.remove("on");
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeOv();});

document.getElementById("foot").textContent=
  "Kenko Call Analysis · Callyzer → Sarvam (batch, diarized) → analysis. Refresh weekly by re-running pipeline.py.";

buildTypeSeg();
buildRepFilter();
renderAll();
</script>
</body>
</html>
